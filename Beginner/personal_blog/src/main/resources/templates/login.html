<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f6f8fc;
            color: #1f2937;
        }

        .container {
            max-width: 440px;
            margin: 48px auto;
            padding: 24px;
            background: #ffffff;
            border: 1px solid #d8deeb;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.6rem;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }

        .message.error {
            background: #fde8e8;
            border: 1px solid #f9b6b6;
            color: #b42318;
        }

        .message.success {
            background: #e8f6ee;
            border: 1px solid #b6e1c5;
            color: #166534;
        }

        label {
            display: block;
            margin: 10px 0 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cfd8ea;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            margin-top: 16px;
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #1e88e5;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 14px;
            color: #1e88e5;
            text-decoration: none;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #5c6478;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Admin Login</h1>

    <p th:if="${param.error}" class="message error">Invalid username or password. Please try again.</p>
    <p th:if="${param.logout}" class="message success">You have been logged out.</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Login</button>
    </form>

    <p class="hint">Default credentials are loaded from application.properties.</p>
    <a class="back-link" th:href="@{/}">← Back to Home</a>
</div>
</body>
</html>
